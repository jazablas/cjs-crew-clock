# Uploads the app to HostGator (cjwtbk.com) every time it's updated.
# Needs three repository secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
# (optional FTP_DIR, e.g. "public_html/" if the FTP login opens one level above the website folder).
name: Deploy to HostGator
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: hostgator
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check the HostGator login is set up
        id: chk
        env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$S" ] || [ -z "$U" ] || [ -z "$P" ]; then
            echo "::warning::HostGator FTP secrets are not set yet. Skipping upload."
            echo "ready=no" >> "$GITHUB_OUTPUT"
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.chk.outputs.ready == 'yes'
      - name: Upload to HostGator
        if: steps.chk.outputs.ready == 'yes'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y lftp >/dev/null
          DIR="${FTP_DIR:-/}"
          # HostGator's FTP certificate is issued to the server's own name (e.g. gatorXXXX.hostgator.com).
          # Read that name from the certificate and connect with it, as long as it's the same machine.
          HOST="$FTP_SERVER"
          CN=$(echo | timeout 20 openssl s_client -connect "$FTP_SERVER:21" -starttls ftp 2>/dev/null | openssl x509 -noout -subject -nameopt multiline 2>/dev/null | awk -F' = ' '/commonName/{print $2}' | sed 's/^\*\.//')
          if [ -n "$CN" ]; then
            A=$(getent ahostsv4 "$FTP_SERVER" | awk '{print $1; exit}'); B=$(getent ahostsv4 "$CN" | awk '{print $1; exit}')
            echo "Certificate name: $CN"
            if [ -n "$A" ] && [ "$A" = "$B" ]; then HOST="$CN"; fi
            # Wildcard certificate (*.hostgator.com): use the server's own hostname from reverse DNS
            if [ "$HOST" = "$FTP_SERVER" ] && [ -n "$A" ]; then
              PTR=$(getent hosts "$A" | awk '{print $2; exit}'); echo "Server name: ${PTR:-unknown}"
              case "$PTR" in *."$CN") C=$(getent ahostsv4 "$PTR" | awk '{print $1; exit}'); [ "$C" = "$A" ] && HOST="$PTR";; esac
            fi
          fi
          # If that server isn't the one hosting cjwtbk.com, use the website's own server name instead.
          W=$(getent ahostsv4 cjwtbk.com | awk '{print $1; exit}'); H=$(getent ahostsv4 "$HOST" | awk '{print $1; exit}')
          if [ -n "$W" ] && [ "$H" != "$W" ]; then
            WP=$(getent hosts "$W" | awk '{print $2; exit}'); echo "Website server name: ${WP:-unknown}"
            case "$WP" in *.hostgator.com) [ "$(getent ahostsv4 "$WP" | awk '{print $1; exit}')" = "$W" ] && HOST="$WP" && echo "Using the website's server instead.";; esac
          fi
          [ "$HOST" = "$FTP_SERVER" ] && echo "::warning::Couldn't match the certificate; set FTP_SERVER to the server name shown in cPanel (for example gator1234.hostgator.com)."
          echo "FTP server address: $(getent ahostsv4 "$HOST" | awk '{print $1; exit}') / website address: $(getent ahostsv4 cjwtbk.com | awk '{print $1; exit}')"
          echo "Username looks like: $(echo "$FTP_USERNAME" | sed -E 's/^(.).*@/\1***@/') (length ${#FTP_USERNAME}), password length ${#FTP_PASSWORD}"
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$HOST" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ftp:passive-mode true
          set net:max-retries 3
          set net:timeout 30
          set cmd:fail-exit true
          mirror --reverse --only-newer --no-perms --parallel=4 --verbose=1 --exclude-glob .git* --exclude-glob .github/ --exclude-glob README.md ./ "$DIR"
          bye
          EOF
      - name: Check the live site
        if: steps.chk.outputs.ready == 'yes'
        run: |
          sleep 5
          for u in https://cjwtbk.com/ https://cjwtbk.com/sw.js https://cjwtbk.com/manifest.webmanifest; do
            echo "$u -> $(curl -s -o /dev/null -w '%{http_code}' "$u")"
          done
