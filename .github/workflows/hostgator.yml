# Uploads the app to HostGator (cjwtbk.com) every time it's updated.
# Needs three repository secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
# (optional FTP_DIR, e.g. "public_html/" if the FTP login opens one level above the website folder).
name: Deploy to HostGator
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: hostgator
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check the HostGator login is set up
        id: chk
        env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$S" ] || [ -z "$U" ] || [ -z "$P" ]; then
            echo "::warning::HostGator FTP secrets are not set yet. Skipping upload."
            echo "ready=no" >> "$GITHUB_OUTPUT"
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.chk.outputs.ready == 'yes'
      - name: Upload to HostGator
        if: steps.chk.outputs.ready == 'yes'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y lftp >/dev/null
          DIR="${FTP_DIR:-/}"
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ftp:passive-mode true
          set net:max-retries 3
          set net:timeout 30
          set cmd:fail-exit true
          mirror --reverse --only-newer --no-perms --parallel=4 --verbose=1 --exclude-glob .git* --exclude-glob .github/ --exclude-glob README.md ./ "$DIR"
          bye
          EOF
      - name: Check the live site
        if: steps.chk.outputs.ready == 'yes'
        run: |
          sleep 5
          for u in https://cjwtbk.com/ https://cjwtbk.com/sw.js https://cjwtbk.com/manifest.webmanifest; do
            echo "$u -> $(curl -s -o /dev/null -w '%{http_code}' "$u")"
          done
