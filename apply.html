<!doctype html>
<html lang="en" data-theme="cream">
<head>
<script>if(location.hostname==="jazablas.github.io"){location.replace("https://cjwtbk.com/"+location.pathname.replace(/^\/cjs-crew-clock\/?/,"")+location.search+location.hash)}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f0e4">
<title>Work at CJ's — The Broaster Kings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CJ's Crew">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="theme.css">
<script>(function(){var t='cream';try{t=window['local'+'Storage'].getItem('cjcc-theme')||'cream'}catch(e){}var c={cream:'#f7f0e4',white:'#f4f4f2',sun:'#fcefc7',cool:'#eceff3',dark:'#16110d'};if(!c[t])t='cream';var h=document.documentElement;if(t==='dark')h.removeAttribute('data-theme');else h.setAttribute('data-theme',t);var m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',c[t]);})();</script>

<style>
body{display:block;min-height:100vh;background:radial-gradient(1200px 500px at 50% -10%,rgba(210,58,31,.18),transparent 60%),var(--bg)}
.ap{max-width:620px;margin:0 auto;padding:36px 18px 60px}
.ap h1{font-family:var(--display);font-weight:900;font-size:clamp(40px,9vw,64px);line-height:.95;text-transform:uppercase;letter-spacing:.01em}
.ap h1 span{color:var(--sauce)}
.ap .lead{color:var(--muted);font-size:16px;margin-top:10px;max-width:46ch}
.jobs{display:grid;gap:10px;margin-top:22px}
.job{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--surface);cursor:pointer}
.job input{margin-top:4px;accent-color:var(--sauce)}
.job:has(input:checked){border-color:var(--sauce);background:rgba(210,58,31,.08)}
.job b{font-size:16px;display:block}
.job .meta{color:var(--muted);font-size:13.5px;margin-top:2px}
.ap form{margin-top:24px}
.ap .fgrid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:520px){.ap .fgrid2{grid-template-columns:1fr}}
.ap .done{margin-top:28px;text-align:center;padding:30px 18px;border:1px solid var(--line);border-radius:20px;background:var(--surface)}
.ap .done svg{width:52px;height:52px;color:var(--ok)}
.ap .done h2{font-family:var(--display);font-weight:800;font-size:34px;text-transform:uppercase;margin-top:8px}
.ap .ic-s svg{width:20px;height:20px;color:var(--mustard)}
html{background:var(--bg)}
.ap-prog{margin:22px 0 4px}.ap-prog .prog{margin-top:8px;height:6px}
.ap-h{font-family:var(--display);font-weight:800;font-size:28px;text-transform:uppercase;margin:18px 0 12px}
.ap-h3{font-family:var(--display);font-weight:800;font-size:20px;text-transform:uppercase;margin:22px 0 8px}
.ap-card{padding:14px;margin-top:12px;display:block}.ap-card b{font-size:15px}
.ap-nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px}.ap-nav .btn{flex:1;max-width:240px}.ap-nav .btn.primary{margin-left:auto}
.seg{display:flex;gap:8px}.seg button{flex:1;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-weight:600;cursor:pointer}
.seg button.on{border-color:var(--sauce);background:rgba(210,58,31,.14);color:var(--text)}
.av-grid{display:grid;grid-template-columns:52px repeat(3,1fr);gap:6px;align-items:center;margin-bottom:14px}
.av-h{font-size:12px;color:var(--muted);text-align:center;font-weight:600}.av-d{font-weight:700;font-size:14px}
.av-c{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;display:grid;place-items:center}
.av-c.on{background:var(--sauce);border-color:var(--sauce);color:#fff}.av-c svg{width:18px;height:18px}
.chips-wrap{display:flex;flex-wrap:wrap;gap:8px}
.chip-t{padding:9px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:14px;cursor:pointer}
.chip-t.on{border-color:var(--sauce);background:rgba(210,58,31,.14)}
.rv-r{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}.rv-r span{color:var(--muted);flex:none}.rv-r b{font-weight:600;font-size:14px !important;text-align:right}
.sig{font-family:'Brush Script MT','Segoe Script',cursive;font-size:22px}
em.faint{font-style:normal}
.ap footer{margin-top:30px;color:var(--faint);font-size:12.5px;text-align:center}
</style>
</head>
<body>
<main class="ap" id="ap"><p class="muted">Loading open jobs…</p></main>
<div id="toast" class="toast" role="status"></div>
<script>window.__CC_ROLE__ = 'public';</script><script src="config.js"></script>
<script src="store.js"></script>
<script src="apply.js"></script>
<script>
(() => {
'use strict';
const {ic, esc, money, now} = CC;
const root = document.getElementById('ap');
const want = new URLSearchParams(location.search).get('job');
const toast = m => { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(()=>t.classList.remove('show'), 2600); };
/* Live app: jobs come from the server; the application (and resume) is sent straight to it. */
const API = CC.PROD ? window.__CC__.api.replace(/\/$/,'') : '';
let PJ = null;
function formHtml(jobs, venueName, sel){
  return `
    <div class="brand-word" style="font-size:18px">CJ<span>&rsquo;</span>s · The Broaster Kings</div>
    <h1 style="margin-top:14px">Join the <span>crew</span></h1>
    <p class="lead">Broasted chicken in LA, from our Pico Blvd kitchen to stadium stands and the Boss Truck. Pick a job and tell us a little about you. It takes two minutes.</p>
    <form id="apf" novalidate>
      <div class="label">Open jobs</div>
      <div class="jobs" role="radiogroup">${jobs.map(j => `<label class="job"><input type="radio" name="job" value="${esc(j.id)}" ${j.id===sel?'checked':''}><span><b>${esc(j.title)}</b><span class="meta">${esc(venueName(j))} · ${esc(j.type)} · ${money(j.rate)}/hr</span><span class="meta" style="color:var(--text);margin-top:4px;display:block">${esc(j.desc||'')}</span></span></label>`).join('')}</div>
      <div class="fgrid2" style="margin-top:12px">
        <label class="field"><span>Full name</span><input class="input" id="apName" autocomplete="name" required maxlength="60"></label>
        <label class="field"><span>Phone</span><input class="input" id="apPhone" type="tel" autocomplete="tel" required placeholder="(310) 555-0100"></label>
      </div>
      <label class="field"><span>Email (optional)</span><input class="input" id="apEmail" type="email" autocomplete="email" placeholder="you@example.com" maxlength="120"></label>
      <label class="field"><span>When can you work?</span><input class="input" id="apAvail" placeholder="e.g. Evenings and weekends, not Tuesdays" maxlength="300"></label>
      <label class="field"><span>Experience (optional)</span><textarea class="input" id="apNote" placeholder="Restaurants, food trucks, events… anything counts" maxlength="1500"></textarea></label>
      ${CC.PROD ? `<label class="field"><span>Resume (optional · PDF, Word or photo, up to 10 MB)</span><input class="input" id="apResume" type="file" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png,.heic,.webp,.txt,application/pdf,image/*"></label>
      <label class="field" style="position:absolute;left:-9999px" aria-hidden="true"><span>Website</span><input id="apWeb" tabindex="-1" autocomplete="off"></label>` : ''}
      <label class="check"><input type="checkbox" id="apAge"><span>I&rsquo;m at least 16 years old. <span class="faint">If you&rsquo;re under 18 you&rsquo;ll need a work permit.</span></span></label>
      <details class="card small" style="margin-top:14px;line-height:1.55"><summary style="cursor:pointer"><b>How we use your information</b></summary>
        <p style="margin-top:8px">We collect your name, contact details, availability, experience and any resume you upload only to review your application and contact you about this job. It goes only to CJ&rsquo;s Wings hiring managers, is stored privately, and is not sold or shared. If you aren&rsquo;t hired, we keep it for up to 4 years (as California employment rules require) and then delete it. To ask what we have or to have it corrected, ask any manager.</p>
        <p style="margin-top:8px">CJ&rsquo;s Wings is an equal opportunity employer. Following the California Fair Chance Act, we don&rsquo;t ask about conviction history on this application. We consider qualified applicants with arrest or conviction records.</p>
      </details>
      <button class="btn primary" style="margin-top:18px" type="submit" id="apSend">${ic('check')} Send application</button>
    </form>
    <footer>Your info goes only to the CJ&rsquo;s hiring manager.</footer>`;
}
function doneHtml(name, title, phone){ return `<div class="done">${ic('check')}<h2>Thanks, ${esc(name.split(' ')[0])}</h2><p class="muted">We got your application for <b style="color:var(--text)">${esc(title)}</b>. If it&rsquo;s a fit, we&rsquo;ll contact you at ${esc(String(phone).replace(/\D/g,'').replace(/^1(?=\d{10}$)/,'').replace(/^(\d{3})(\d{3})(\d{4})$/,'($1) $2-$3'))} to set up an interview.</p></div>`; }
function validate(){
  const v = id => document.getElementById(id).value.trim();
  const name = v('apName').replace(/[<>"&`]/g,'').slice(0,60), phone = v('apPhone'), email = v('apEmail');
  if (name.length < 3){ toast('Add your full name'); return null; }
  if (phone.replace(/\D/g,'').replace(/^1(?=\d{10}$)/,'').length !== 10){ toast('Add a 10-digit phone number'); return null; }
  if (email && !/^\S+@\S+\.\S+$/.test(email)){ toast('That email looks off'); return null; }
  if (!document.getElementById('apAge').checked){ toast('Please confirm your age'); return null; }
  return {name, phone, email, avail:v('apAvail'), note:v('apNote'), job:document.querySelector('input[name=job]:checked').value};
}
async function renderProd(){ if (window.CC_APPLY_START) return window.CC_APPLY_START();
  if (!PJ){ try { const r = await fetch(API + '/public/jobs', {cache:'no-store'}); PJ = await r.json(); } catch(e){ root.innerHTML = '<p class="muted">Couldn’t load jobs. Check your connection and refresh.</p>'; return; } }
  const jobs = PJ.jobs || [];
  if (!jobs.length){ root.innerHTML = `<h1>Work at <span>CJ&rsquo;s</span></h1><p class="lead">We&rsquo;re not hiring right now. Check back soon, or stop by the Pico Blvd kitchen and say hi.</p>`; return; }
  const sel = jobs.find(j => j.id === want)?.id || jobs[0].id;
  root.innerHTML = formHtml(jobs, j => j.venue, sel);
  document.getElementById('apf').addEventListener('submit', async ev => { ev.preventDefault();
    const d = validate(); if (!d) return;
    const f = document.getElementById('apResume').files[0];
    if (f && f.size > 10*1024*1024){ toast('Your resume must be 10 MB or smaller'); return; }
    const fd = new FormData(); Object.entries(d).forEach(([k,v]) => fd.append(k, v)); fd.append('age', 'yes'); fd.append('website', document.getElementById('apWeb').value);
    if (f) fd.append('resume', f);
    const btn = document.getElementById('apSend'); btn.disabled = true; btn.textContent = 'Sending…';
    let r, j = {};
    try { r = await fetch(API + '/apply', {method:'POST', body:fd}); j = await r.json().catch(() => ({})); } catch(e){ r = null; }
    if (!r || !r.ok){ btn.disabled = false; btn.innerHTML = `${ic('check')} Send application`; toast(j.error || 'Couldn’t send. Check your connection and try again.'); return; }
    root.innerHTML = doneHtml(d.name, jobs.find(x => x.id === d.job)?.title || 'the job', d.phone); window.scrollTo(0,0); });
}
function render(){
  if (CC.PROD) return renderProd();
  const jobs = (CC.db.jobs||[]).filter(j => j.status === 'Open');
  if (!jobs.length){ root.innerHTML = `<h1>Work at <span>CJ&rsquo;s</span></h1><p class="lead">We&rsquo;re not hiring right now. Check back soon, or stop by the Pico Blvd kitchen and say hi.</p>`; return; }
  const sel = jobs.find(j => j.id === want)?.id || jobs[0].id;
  root.innerHTML = formHtml(jobs, j => CC.venueById(j.venue)?.name || '', sel);
  document.getElementById('apf').addEventListener('submit', ev => { ev.preventDefault();
    const d = validate(); if (!d) return;
    const jt = CC.db.jobs.find(j=>j.id===d.job);
    const note = [d.avail && `Available: ${d.avail}`, d.note].filter(Boolean).join('. ');
    CC.db.applicants.push({id:CC.id('AP'), job:d.job, name:d.name, phone:d.phone, email:d.email, stage:'Applied', t:now(), note});
    CC.notify('mgr', `New application: ${d.name} for ${jt.title}.`, 'Push', 'hiring'); CC.log(d.name, `Applied for ${jt.title}`); CC.save();
    root.innerHTML = doneHtml(d.name, jt.title, d.phone); window.scrollTo(0,0); });
}
CC.ready.then(render);
})();
</script>
</body>
</html>
